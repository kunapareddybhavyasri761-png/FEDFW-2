<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <input type="email"
           id="loginEmail"
           placeholder="Enter Email">

    <input type="password"
           id="loginPassword"
           placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <p>
        New User?
        <a href="signup.html">Create Account</a>
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
